[settings]
lockfile = true

[tools]
java = "temurin-21.0.13+9.0.LTS"
zig = "0.17.0"
"github:kjanat/actionlint" = "1.17.0"
"github:rvben/rumdl" = "0.3.2"

# The native build needs ANDROID_NDK_HOME (or ANDROID_NDK_ROOT) set to one
# installed NDK version, such as $ANDROID_HOME/ndk/28.2.13676358.
[tasks.native]
description = "Build libabyssh_jni.so into android/app/src/main/jniLibs"
dir = "zig-src"
run = "zig build -Doptimize=ReleaseFast jni"

[tasks.build]
description = "Assemble the debug APK"
dir = "android"
run = "./gradlew assembleDebug"

[tasks.install]
description = "Install the debug APK on a connected device and launch it"
dir = "android"
run = [
  "./gradlew installDebug",
  "adb shell am start -n io.github.andreacovelli.abyssh.debug/io.github.andreacovelli.abyssh.MainActivity",
]

[tasks.lint]
description = "Run Android Lint on the debug variant"
dir = "android"
run = "./gradlew lintDebug"

[tasks.test]
description = "Run local JVM unit tests"
dir = "android"
run = "./gradlew testDebugUnitTest"

[tasks."test:device"]
description = "Run instrumented tests on a connected device or emulator"
dir = "android"
# Keep the app installed afterwards: Gradle otherwise uninstalls it, which deletes the
# hosts, keys, and settings saved on the device.
run = "./gradlew connectedDebugAndroidTest -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true"

[tasks."test:device:compile"]
description = "Compile the instrumented tests without running them, so they need no device"
dir = "android"
run = "./gradlew compileDebugAndroidTestKotlin"

[tasks.format]
description = "Format Kotlin sources and Gradle scripts with ktlint"
dir = "android"
run = "./gradlew spotlessApply"

[tasks."format:check"]
description = "Check Kotlin and Gradle script formatting"
dir = "android"
run = "./gradlew spotlessCheck"

[tasks.detekt]
description = "Run Detekt static analysis"
dir = "android"
run = "./gradlew detekt"

# CI runs these on a push that a pull request already validated, only when the dependency
# cache is missing, so main can still seed it: pull requests cannot save caches.
[tasks."deps:android"]
description = "Resolve and compile what the Gradle checks need, to seed the CI dependency cache"
dir = "android"
# Keep the Gradle tasks in step with mise-tasks/check/_default.
run = "./gradlew --continue spotlessCheck detekt lintDebug testDebugUnitTest compileDebugAndroidTestKotlin assembleDebug"

[tasks."deps:zig"]
description = "Fetch the Zig packages, to seed the CI dependency cache"
dir = "zig-src"
run = "zig build --fetch=all"

[tasks."check:actions"]
description = "Lint GitHub Actions workflows"
run = "actionlint"

[tasks."check:docs"]
description = "Lint Markdown files"
run = "rumdl check ."

# `mise run check` is the file task mise-tasks/check, which runs only check:docs when
# a branch changes nothing but Markdown.
