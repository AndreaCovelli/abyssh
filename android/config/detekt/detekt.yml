build:
  maxIssues: 0

config:
  validation: true

# Several complexity thresholds sit above Detekt's defaults on purpose. At the defaults
# (LongMethod 60, LongParameterList 6 and 7) about 90 functions fail, nearly all of them
# Compose screens, which take one callback per action and read top to bottom as one
# layout, JNI bridges, whose signatures mirror the native exports, and session classes
# whose constructors receive their collaborators. Splitting those would scatter the code
# without making it simpler. Lower a threshold only after fixing what it then reports.
complexity:
  LongMethod:
    active: true
    threshold: 140
  CyclomaticComplexMethod:
    active: true
    threshold: 25
    # Key-code lookup tables are long `when`s with one value per branch.
    ignoreSimpleWhenEntries: true
  ComplexCondition:
    active: true
    threshold: 6
  LongParameterList:
    active: true
    functionThreshold: 12
    constructorThreshold: 12
    ignoreDefaultParameters: true
  NestedBlockDepth:
    active: true
    threshold: 6
  TooManyFunctions:
    active: true
    thresholdInFiles: 30
    thresholdInClasses: 25
    thresholdInInterfaces: 25
    thresholdInObjects: 25
    thresholdInEnums: 25
    ignoreAnnotatedFunctions:
      - Composable

exceptions:
  SwallowedException:
    active: true
    ignoredExceptionTypes:
      - InterruptedException
      - NumberFormatException
      - ParseException

naming:
  FunctionNaming:
    active: true
    functionPattern: '[a-z][a-zA-Z0-9]*'
    ignoreAnnotated:
      - Composable
  TopLevelPropertyNaming:
    active: true
    constantPattern: '[A-Z][_A-Z0-9]*'

potential-bugs:
  UnsafeCallOnNullableType:
    active: true
  EqualsWithHashCodeExist:
    active: true
  UnreachableCode:
    active: true

empty-blocks:
  EmptyCatchBlock:
    active: true
    allowedExceptionNameRegex: '^(ignore|expected)$'

style:
  UnusedImports:
    active: true
  UnusedPrivateClass:
    active: true
  UnusedPrivateMember:
    active: true
  UnusedPrivateProperty:
    active: true
  ModifierOrder:
    active: true
  MagicNumber:
    active: false
  WildcardImport:
    active: true
  MaxLineLength:
    active: false
  ReturnCount:
    active: false
  ThrowsCount:
    active: false
  ForbiddenComment:
    active: true
    comments:
      - value: 'TODO:'
        reason: 'Track TODOs in issues instead of leaving them in production code.'
      - value: 'FIXME:'
        reason: 'Track fixes in issues instead of leaving them in production code.'
