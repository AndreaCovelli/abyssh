# Setting org.gradle.jvmargs drops Gradle's own defaults (gradle/gradle#19750), so the
# metaspace cap and heap dump flag are restated here.
org.gradle.jvmargs=-Xmx4g -XX:ReservedCodeCacheSize=512m -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -XX:+UseParallelGC -Dfile.encoding=UTF-8
# Without its own value, the Kotlin daemon copies ReservedCodeCacheSize from
# org.gradle.jvmargs. 320m is its usual default, which it never fills.
kotlin.daemon.jvmargs=-Xmx2g -XX:ReservedCodeCacheSize=320m
# Resolve the Java toolchain to the JDK that mise pins, never a downloaded one.
org.gradle.java.installations.fromEnv=JAVA_HOME
org.gradle.java.installations.auto-download=false
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true
org.gradle.caching=true
