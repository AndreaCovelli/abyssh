on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag to publish (required for manual runs)"
        required: false
        type: string

name: Release

jobs:
  release:
    permissions:
      contents: write
      id-token: write
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set up locked tools
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          version: 2026.10.14
          install_args: java zig

      - name: parse version from tag
        id: version
        if: ${{ github.ref_type == 'tag' || inputs.release_tag != '' }}
        run: |
          set -e
          TAG="${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}"
          VERSION="${TAG#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$TAG' is not a valid semver (expected MAJOR.MINOR.PATCH, optionally prefixed with 'v')"
            exit 1
          fi
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          for COMPONENT in "$MAJOR" "$MINOR" "$PATCH"; do
            if [ "$COMPONENT" -gt 99 ]; then
              echo "::error::Version component '$COMPONENT' exceeds 99 (MMmmpp scheme limit)"
              exit 1
            fi
          done
          {
            echo "major=$MAJOR"
            echo "minor=$MINOR"
            echo "patch=$PATCH"
            echo "version=$VERSION"
          } >> "$GITHUB_OUTPUT"
          echo "Parsed version: $VERSION (major=$MAJOR minor=$MINOR patch=$PATCH)"

      - name: build native library
        run: ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" mise run native -Dtarget=aarch64-linux-android.24

      - name: generate release key
        run: |
          cd android/app/ && echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > key.jks

      - name: build android release artifacts (APK + AAB)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_MAJOR: ${{ steps.version.outputs.major }}
          VERSION_MINOR: ${{ steps.version.outputs.minor }}
          VERSION_PATCH: ${{ steps.version.outputs.patch }}
          ANDROID_ABI_FILTERS: arm64-v8a
        working-directory: android
        run: ./gradlew assembleRelease bundleRelease --console=plain

      - name: upload release
        if: ${{ github.ref_type == 'tag' || inputs.release_tag != '' }}
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}
          target_commitish: ${{ github.sha }}
          draft: true
          files: |
            ./android/app/build/outputs/apk/release/*.apk
            ./android/app/build/outputs/bundle/release/*.aab
          fail_on_unmatched_files: true

