on:
  push:
    tags:
      - "v*.*.*"

name: Release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never interrupt a release that may already be publishing.
  cancel-in-progress: false

permissions: {}

jobs:
  gate:
    name: Require main CI
    runs-on: ubuntu-slim
    timeout-minutes: 25
    permissions:
      contents: read
      checks: read
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require the tagged commit on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      # CI on main may still be running when the tag is pushed right after a merge.
      - name: Wait for CI on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for _ in $(seq 40); do
            RESULT=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?check_name=Validate" \
              --jq '.check_runs | sort_by(.started_at) | last | "\(.status) \(.conclusion)"')
            case "$RESULT" in
              "completed success")
                echo "CI passed on $GITHUB_SHA"
                exit 0
                ;;
              completed*)
                echo "::error::CI finished as '${RESULT#completed }' on $GITHUB_SHA"
                exit 1
                ;;
            esac
            sleep 30
          done
          echo "::error::CI did not finish on $GITHUB_SHA within 20 minutes"
          exit 1

  # Builds the arm64 native library in parallel with the gate, so the wait for main CI
  # costs no wall-clock time. It holds no secrets and publishes nothing.
  native:
    name: Build native library
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      # Keep in step with ndk_version in mise-tasks/check/native and ndkVersion in
      # android/app/build.gradle.kts.
      NDK_VERSION: 28.2.13676358
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up locked tools
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          version: 2026.10.14
          install_args: java zig
          # A tag ref's cache is unreadable from every other ref, so don't save one.
          cache_save: false

      # Pin the NDK: the runner's newest NDK can change under us, and NDK 30 headers
      # reject the target triple that Zig's translate-c passes.
      - name: Install the Android NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION"

      - name: Build native library
        run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION" mise run native -Dtarget=aarch64-linux-android.31

      - name: Upload the native library
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-arm64
          path: android/app/src/main/jniLibs/arm64-v8a/libabyssh_jni.so
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish signed release
    needs: [gate, native]
    # The release environment holds the signing secrets and admits only main and v* tags.
    environment: release
    permissions:
      contents: write
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      # Keep in step with ndk_version in mise-tasks/check/native and ndkVersion in
      # android/app/build.gradle.kts.
      NDK_VERSION: 28.2.13676358

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set up locked tools
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          version: 2026.10.14
          install_args: java
          # This job holds the signing secrets and runs on a tag ref: never save a cache.
          cache_save: false

      - name: Parse version from tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          if ! [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Tag '$TAG' is not vMAJOR.MINOR.PATCH"
            exit 1
          fi
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          for COMPONENT in "$MAJOR" "$MINOR" "$PATCH"; do
            if [ "$COMPONENT" -gt 99 ]; then
              echo "::error::Version component '$COMPONENT' exceeds 99 (MMmmpp scheme limit)"
              exit 1
            fi
          done
          {
            echo "major=$MAJOR"
            echo "minor=$MINOR"
            echo "patch=$PATCH"
            echo "version=$VERSION"
          } >> "$GITHUB_OUTPUT"
          echo "Parsed version: $VERSION"

      # The release build strips the native library with this NDK, and AGP needs the pinned
      # version.
      - name: Install the Android NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION"

      - name: Download the native library
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-arm64
          path: android/app/src/main/jniLibs/arm64-v8a

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # Fail here rather than publish an unsigned build.
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build signed APK and AAB
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_MAJOR: ${{ steps.version.outputs.major }}
          VERSION_MINOR: ${{ steps.version.outputs.minor }}
          VERSION_PATCH: ${{ steps.version.outputs.patch }}
          ANDROID_ABI_FILTERS: arm64-v8a
        working-directory: android
        run: ./gradlew assembleRelease bundleRelease --console=plain

      - name: Remove release keystore
        if: ${{ always() }}
        run: rm -f -- "$RUNNER_TEMP/release.jks"

      - name: Reject unsigned or debug-signed artifacts
        run: |
          set -euo pipefail
          OUT=android/app/build/outputs
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          APK_CERT=$("$APKSIGNER" verify --print-certs "$OUT/apk/release/app-release.apk")
          AAB_CERT=$(keytool -printcert -jarfile "$OUT/bundle/release/app-release.aab")
          printf '%s\n%s\n' "$APK_CERT" "$AAB_CERT"
          if ! grep -q 'Owner:' <<< "$AAB_CERT"; then
            echo "::error::The AAB is not signed"
            exit 1
          fi
          if grep -qi 'CN=Android Debug' <<< "$APK_CERT$AAB_CERT"; then
            echo "::error::Refusing to publish artifacts signed with the Android debug certificate"
            exit 1
          fi

      - name: Name release artifacts
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          OUT=./android/app/build/outputs
          mkdir -p dist
          cp "$OUT/apk/release/app-release.apk" "dist/abyssh-${VERSION}-arm64-v8a.apk"
          cp "$OUT/bundle/release/app-release.aab" "dist/abyssh-${VERSION}.aab"
          # Symbols for the stripped native library, to symbolize crash backtraces.
          cp "$OUT/native-debug-symbols/release/native-debug-symbols.zip" \
            "dist/abyssh-${VERSION}-native-debug-symbols.zip"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: Abyssh ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            ./dist/abyssh-*.apk
            ./dist/abyssh-*.aab
            ./dist/abyssh-*-native-debug-symbols.zip
          fail_on_unmatched_files: true
