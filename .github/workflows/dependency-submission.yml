name: Dependency Submission

on:
  push:
    branches: ["main"]
    # Only build inputs change the dependency graph. This workflow is not a required check.
    paths:
      - ".github/workflows/dependency-submission.yml"
      - "android/**/*.gradle.kts"
      - "android/gradle.properties"
      - "android/gradle/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  dependency-submission:
    name: Submit Gradle dependency graph
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          build-root-directory: android
          # Gradle cache restores fall back to the newest entry from any job. A dependency-only
          # entry from this job leaves CI jobs without compiled outputs, so only read caches here.
          cache-read-only: true
