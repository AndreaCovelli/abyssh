name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    uses: AndreaCovelli/repo-baseline/.github/workflows/check.yml@a3cd314a40868370e41af02ecf02af60df5614ee # v1.0.1
    permissions:
      contents: read
      pull-requests: read
    with:
      timeout-minutes: 35
      # The checks build the APK without the native library, so skip Zig.
      install-args: java github:kjanat/actionlint
      cache-path: |
        ~/.gradle/caches
        ~/.gradle/wrapper
      cache-key-files: |
        android/gradle/libs.versions.toml
        android/gradle/wrapper/gradle-wrapper.properties
        android/**/*.gradle.kts
      paths: |
        android/**
        mise.toml
        mise.lock
        .github/workflows/**

  validate:
    name: Validate
    needs: [check]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Check CI results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<<"$NEEDS"
