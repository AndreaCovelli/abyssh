name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    uses: AndreaCovelli/repo-baseline/.github/workflows/check.yml@a3cd314a40868370e41af02ecf02af60df5614ee # v1.0.1
    permissions:
      contents: read
      pull-requests: read
    with:
      timeout-minutes: 35
      # The checks build the APK without the native library, so skip Zig.
      install-args: java github:kjanat/actionlint
      cache-path: |
        ~/.gradle/caches
        ~/.gradle/wrapper
      cache-key-files: |
        android/gradle/libs.versions.toml
        android/gradle/wrapper/gradle-wrapper.properties
        android/**/*.gradle.kts
      paths: |
        android/**
        .editorconfig
        mise.toml
        mise.lock
        .github/workflows/**

  secrets:
    name: Secrets
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # Push runs scan the pushed commits, pull requests scan the PR commits, and manual runs
      # scan the full history. Commit ranges need the full checkout above.
      - name: Scan new commits for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  validate:
    name: Validate
    needs: [check, secrets]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Check CI results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<<"$NEEDS"
