name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Only pull requests cancel superseded runs: a cancelled main run leaves no Validate
  # result for its commit and skips its cache saves, and the release gate needs both.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Markdown-only changes, including pushes to main, run just the Markdown lint here
  # and skip the Gradle checks below. A push to main skips the work whenever a pull
  # request already validated the same tree.
  docs:
    name: Docs
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Check
        uses: AndreaCovelli/repo-baseline/.github/actions/check@a9310352317e707bffc0e031caf29d3c48d7eb97 # v1.1.0
        with:
          task: check:docs
          install-args: github:rvben/rumdl
          paths: |
            **/*.md
            .rumdl.toml

  check:
    name: Check
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Check
        uses: AndreaCovelli/repo-baseline/.github/actions/check@a9310352317e707bffc0e031caf29d3c48d7eb97 # v1.1.0
        with:
          # The checks build the APK without the native library, so skip Zig.
          install-args: java github:kjanat/actionlint github:rvben/rumdl
          # A push that a pull request already validated runs this on a missing cache
          # only, to seed it: pull requests cannot save caches.
          setup-task: deps:android
          cache-path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          # Build scripts are left out so that editing one does not create another
          # 1+ GB entry; restore-keys fall back to the newest cache instead.
          cache-key-files: |
            android/gradle/libs.versions.toml
            android/gradle/wrapper/gradle-wrapper.properties
          paths: |
            android/**
            .editorconfig
            mise.toml
            mise.lock
            mise-tasks/check/_default
            .github/workflows/**

  # Builds the arm64 native library with the pinned NDK and checks that every Kotlin
  # external fun has a JNI export, which nothing else catches before runtime.
  native:
    name: Native
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Check
        uses: AndreaCovelli/repo-baseline/.github/actions/check@a9310352317e707bffc0e031caf29d3c48d7eb97 # v1.1.0
        with:
          task: check:native
          # Fetch the Zig packages when a push reuses a pull request's result but the
          # cache is missing, to seed it.
          setup-task: deps:zig
          # sdkmanager, which installs the NDK, needs Java.
          install-args: java zig
          cache-path: zig-src/zig-pkg
          cache-key-files: zig-src/build.zig.zon
          paths: |
            zig-src/**
            android/app/src/main/java/**/*Bridge.kt
            mise.toml
            mise.lock
            mise-tasks/check/native
            .github/workflows/ci.yml

  # Builds the x86_64 native library once for the emulator jobs below. Its path filter
  # also decides whether they run: Check's paths plus the Zig sources, since a native
  # change can break the app on a device too. A push to main that a pull request already
  # validated skips it and the device jobs.
  native-x86_64:
    name: Native x86_64
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      checks: read
      contents: read
      pull-requests: read
    outputs:
      relevant: ${{ steps.relevant.outputs.relevant }}
    env:
      # Keep in step with ndk_version in mise-tasks/check/native.
      NDK_VERSION: 28.2.13676358
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Push comparisons need the previous commit.
          fetch-depth: 0
          persist-credentials: false

      # Manual runs and force pushes have nothing to compare against, so they run.
      - name: Detect relevant changes
        id: changes
        if: >-
          !github.event.forced &&
          (github.event_name == 'pull_request' || github.event_name == 'push')
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          base: ${{ github.event_name == 'push' && github.ref || '' }}
          filters: |
            relevant:
              - 'android/**'
              - '.editorconfig'
              - 'mise.toml'
              - 'mise.lock'
              - 'mise-tasks/check/_default'
              - '.github/workflows/**'
              - 'zig-src/**'

      - name: Look for an earlier validation
        id: earlier
        if: steps.changes.outcome == 'skipped' || steps.changes.outputs.relevant == 'true'
        uses: AndreaCovelli/repo-baseline/.github/actions/tree-validated@a9310352317e707bffc0e031caf29d3c48d7eb97 # v1.1.0

      - name: Decide whether to run
        id: relevant
        env:
          RELEVANT: ${{ steps.changes.outcome == 'skipped' || steps.changes.outputs.relevant == 'true' }}
          REUSED: ${{ steps.earlier.outputs.validated == 'true' }}
        run: |
          if [[ "$RELEVANT" == true && "$REUSED" != true ]]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No relevant changes or already validated; skipping the device tests"
          fi

      - name: Set up locked tools
        if: steps.relevant.outputs.relevant == 'true'
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          version: 2026.10.14
          install_args: java zig
          cache_save: ${{ github.event_name != 'pull_request' }}

      # The Native job saves this cache on main.
      - name: Restore Zig packages
        if: steps.relevant.outputs.relevant == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: zig-src/zig-pkg
          key: deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('zig-src/build.zig.zon') }}

      - name: Install the Android NDK
        if: steps.relevant.outputs.relevant == 'true'
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" >/dev/null

      - name: Build the x86_64 native library
        if: steps.relevant.outputs.relevant == 'true'
        run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION" mise run native -Dtarget=x86_64-linux-android

      - name: Upload the native library
        if: steps.relevant.outputs.relevant == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-x86_64
          path: android/app/src/main/jniLibs/x86_64/libabyssh_jni.so
          if-no-files-found: error
          retention-days: 1

  # Instrumented tests on the Gradle-managed emulator, against the debug build and
  # against the R8-minified release build. The minified run catches R8 removing or
  # renaming what the native code looks up over JNI.
  device:
    name: Device (${{ matrix.build }})
    needs: native-x86_64
    if: needs.native-x86_64.outputs.relevant == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        build: [debug, minified]
    env:
      # Leave memory for the emulator.
      GRADLE_OPTS: >-
        -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options=-Xmx1g"
      SYSTEM_IMAGE: system-images;android-34;aosp_atd;x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the native library
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-x86_64
          path: android/app/src/main/jniLibs/x86_64

      # The emulator and system image need the space. Without the NDK, AGP packages the
      # native library unstripped, which is fine for tests.
      - name: Free disk space
        run: |
          sudo rm -rf "$ANDROID_HOME/ndk"
          df -h /

      - name: Set up locked tools
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          version: 2026.10.14
          install_args: java
          cache_save: ${{ github.event_name != 'pull_request' }}

      # The Check job saves this cache on main, under the same key.
      - name: Restore Gradle caches
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: >-
            deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('android/gradle/libs.versions.toml',
            'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: deps-${{ runner.os }}-${{ runner.arch }}-

      - name: Install the emulator and system image
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "emulator" "$SYSTEM_IMAGE" >/dev/null

      - name: Enable KVM
        run: |
          sudo chmod 666 /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -accel-check

      # Creating the AVD can stall, so give it its own deadline.
      - name: Set up the managed device
        working-directory: android
        timeout-minutes: 5
        run: ./gradlew dev34Setup --console=plain

      # A test APK that crashes at start leaves Gradle waiting, so fail well before the job
      # timeout.
      - name: Run instrumented tests
        working-directory: android
        timeout-minutes: 15
        env:
          BUILD: ${{ matrix.build }}
        run: |
          if [[ "$BUILD" == minified ]]; then
            # lintVital runs for release-like builds and isn't what this job tests.
            args=(dev34MinifiedAndroidTest -PtestBuildType=minified -x lintVitalMinified)
          else
            args=(dev34DebugAndroidTest)
          fi
          ./gradlew "${args[@]}" --console=plain \
            -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect

      - name: Check that tests ran
        run: |
          shopt -s globstar nullglob
          results=(android/app/build/outputs/androidTest-results/managedDevice/**/TEST-*.xml)
          if ((${#results[@]} == 0)) || ! grep -q '<testcase' "${results[@]}"; then
            echo "::error::The instrumented tests wrote no results"
            exit 1
          fi

      - name: Upload test reports
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: device-reports-${{ matrix.build }}
          path: |
            android/app/build/reports/androidTests/managedDevice/
            android/app/build/outputs/androidTest-results/managedDevice/
          if-no-files-found: warn
          retention-days: 7

  secrets:
    name: Secrets
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # Push runs scan the pushed commits, pull requests scan the PR commits, and manual runs
      # scan the full history. Commit ranges need the full checkout above.
      - name: Scan new commits for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  validate:
    name: Validate
    needs: [docs, check, native, native-x86_64, device, secrets]
    if: always()
    runs-on: ubuntu-slim
    timeout-minutes: 3
    steps:
      - name: Check CI results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<<"$NEEDS"
